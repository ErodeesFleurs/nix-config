# Vertical Candidate List
Vertical Candidate List=False
# Wheel For Paging
WheelForPaging=True
# Font
Font="@font@ 13"
# Menu Font
MenuFont="@font@ 13"
# Tray Font
TrayFont="@font@ 12"
# Theme
Theme=Monet<* if {{ is_dark_mode }} *>Dark<* else *>Light<* endif *>
# Dark Theme
DarkTheme=Monet<* if {{ is_dark_mode }} *>Dark<* else *>Light<* endif *>
# Use Dark Theme
UseDarkTheme=False
# Use Per Screen DPI
PerScreenDPI=True
